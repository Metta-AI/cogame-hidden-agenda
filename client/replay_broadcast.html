@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --green: #45a85e;
  --yellow: #ddc531;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
  /* One-finger drags belong to the PAGE while the board is fitted; syncTouchAction
     takes them back (touch-action: none) once there is somewhere to pan. Neither
     value permits pinch-zoom, so the second finger always reaches our handler
     instead of zooming the document. */
  touch-action: pan-x pan-y;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* Team color utility: any chrome element carrying a team-name class exposes
   that team's tint as --tc, and every team-colored rule below reads
   var(--tc, <neutral fallback>). Supporting a new team = one line here plus
   its art — no per-team selector pairs anywhere else. */
.red { --tc: var(--red); }
.blue { --tc: var(--blue); }
.green { --tc: var(--green); }
.yellow { --tc: var(--yellow); }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

/* One side of the scorebug: one plate per side for classic red/blue (exactly
   the old layout); a 3-4 team game puts BOTH of a side's plates on the same
   row (outer team at the screen edge, inner team beside the clock), so all
   four teams read on one line across the band. */
.plates {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: calc(5 * var(--u));
  min-width: 0;
}
.plates.row { flex-direction: row; align-items: center; gap: calc(18 * var(--u)); }
.plates.row .plate { flex: 1 1 0; }
.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
/* Orientation is a SIDE property, not a color property: right-side plates
   mirror so both team names stay innermost, flanking the clock. */
.plate.side-r { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate .team-name { color: var(--tc, var(--paper)); }

/* One baseline row with the TEAM NAME innermost (toward the center clock):
   a left plate reads "32 LIVES RED", a right plate reads "BLUE LIVES 32", so
   names flank the clock. Left reverses; right keeps DOM order (name → label → num). */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.side-l .lives-line { flex-direction: row-reverse; }
.lives-num {
  font-family: var(--pixfont);
  font-size: calc(20 * var(--u));
  line-height: 1;
  color: var(--paper);
  flex: none;
}
.lives-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
/* Team-perk badges, riding the squad-pip strip (the pip strip IS the life
   meter — see renderSquad). Each policy's pips form one .squad-pol block
   with that policy's badges beside them; the center-adjacent pips with
   badges flanking OUTSIDE come from renderSquad's fixed DOM order
   (group 0: icons,pips; group 1: pips,icons), never from side-reversal CSS
   — see the .squad-pol comment below for why mirroring was removed. Badges
   keep each perk's own fixed color (never team-tinted). */
.plate .perk-icos {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.plate .perk-ico { display: inline-flex; }
.plate .perk-ico svg {
  width: calc(10 * var(--u));
  height: calc(10 * var(--u));
  display: block;
}
/* Handicap chip: an amber pill next to the team name when that team is
   weakened. The full delta breakdown rides in the native `title` on hover
   (cursor:help hints it). Hidden entirely for an unhandicapped team. */
.plate .hcap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  line-height: 1;
  color: var(--ink);
  background: var(--amber);
  border-radius: calc(3 * var(--u));
  padding: calc(2 * var(--u)) calc(4 * var(--u));
  flex: none;
  cursor: help;
  white-space: nowrap;
}
/* Squad strip: ONE pip per player (8). Each pip is a tiny pie: the filled
   wedge is that seat's remaining lives (full square = all lives, a sliver =
   last life), dim = down-but-respawning, hollow = eliminated. The strip is
   the "who's left" read; the big numeral is the exact lives count. Each pip
   is clickable → POV lens (fog-honesty). */
.squad {
  display: flex;
  gap: calc(6 * var(--u));
  margin-top: calc(3 * var(--u));
}
.plate.side-r .squad { justify-content: flex-end; }
/* Policy groups keep the HEADLINE's left-to-right order on BOTH plates — the
   first-named policy's pips are always the left group, so a badge reads as
   belonging to the name it sits under. (No side mirroring: an early version
   reversed the strip on side-l for clock-symmetry, which visually attached
   the left badges to the wrong policy name.) */
.squad-pol {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
}
.squad-pip {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  /* --fill (0..1) = lives left / max lives; wedge sweeps clockwise from 12 */
  background: conic-gradient(currentColor calc(var(--fill, 1) * 1turn), transparent 0);
  opacity: 0.92;
  cursor: pointer;
  position: relative;
  transition: opacity 140ms, transform 140ms;
}
/* faint frame so a part-filled pie still reads as one square slot */
.squad-pip::after {
  content: '';
  position: absolute;
  inset: 0;
  box-shadow: inset 0 0 0 calc(1 * var(--u)) currentColor;
  opacity: 0.35;
}
.squad-pip:hover { transform: translateY(calc(-1 * var(--u))); }
.squad-pip.down { opacity: 0.3; }                              /* dead, lives left */
.squad-pip.out {                                              /* eliminated */
  background: transparent;
  box-shadow: inset 0 0 0 calc(1.5 * var(--u)) currentColor;
  opacity: 0.28;
}
.squad-pip.out::after { display: none; }       /* .out draws its own outline */
.squad-pip.carry {                                            /* has the flag */
  background: conic-gradient(var(--amber) calc(var(--fill, 1) * 1turn), transparent 0);
  box-shadow: 0 0 calc(7 * var(--u)) var(--amber);
}
.squad-pip.pov {                                             /* POV lens active */
  box-shadow: 0 0 0 calc(1.5 * var(--u)) var(--paper);
}
.plate .squad { color: var(--tc, var(--paper)); }

/* flag-state icon — HOME (on pedestal) / TAKEN (riding a carrier) /
   CAPTURED (GV32: retired, team eliminated — drawn like TAKEN). F2. */
.flagicon {
  position: relative;
  width: calc(26 * var(--u));
  height: calc(30 * var(--u));
  flex: none;
}
.flagicon svg { width: 100%; height: 100%; display: block; }
/* transform-box:fill-box so SVG transforms pivot about the cloth's own box,
   not the viewBox edge (else the flip mirrors off-screen — invisible-at-vote). */
.flagicon .cloth { transition: transform 90ms steps(3); transform-box: fill-box; transform-origin: left center; }
.flagicon.taken .cloth { transform: scaleX(0.62) skewX(-8deg); }
.flagicon.flip { animation: flagflip 260ms steps(3); transform-box: fill-box; transform-origin: center; }
@keyframes flagflip { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
.flagicon .carrier-tag {
  position: absolute;
  bottom: calc(-11 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  white-space: nowrap;
  color: var(--amber);
  text-transform: uppercase;
  /* An outermost flag icon sits at the screen edge; an unclamped centered
     tag would poke past it (seen as stray clipped names at the band edges
     in 4-team games). */
  max-width: calc(58 * var(--u));
  overflow: hidden;
  text-overflow: ellipsis;
}

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

/* leader pulse when a team's lives lead is >=3 */
.plate.leader .lives-num { animation: leaderpulse 1.9s ease-in-out infinite; }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* Beat-pause (§11): idle systems freeze the instant a beat lands, so ambient
   never competes with a kill/steal/capture for the eye. Applied on #stage; the
   engine-driven board (24Hz) is untouched — only chrome ambient pauses. */
#stage.beat-active .amb,
#stage.beat-active .plate.leader .lives-num { animation-play-state: paused; }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--tc, var(--red)); font-size: calc(15 * var(--u)); }
/* the acting team's tint rides as a left accent bar (any team color) */
.banner-chip.accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--tc, var(--amber)); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom). column-reverse so the newest row sits lowest, nearest the
     transport, and older kills stack upward — a broadcast lower-third feed. */
  bottom: calc(76 * var(--u));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who { color: var(--tc, var(--paper)); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }
.feed-row.flagkill { box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }

/* Roster rails removed: per-player state now rides the scorebug squad strip
   (the roster IS the counter, genre convention) and the board's own name tags.
   No floating bordered rails over the arena flanks (in-world, no HUD chrome). */

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* kill ticks are short and colored by the KILLER's team (a red tick = red
   scored a kill); team-kills and unattributable pileups stay neutral. */
.beat-marker.kill { background: var(--tc, var(--paper-dim)); height: calc(6 * var(--u)); }
/* flag beats are colored by the FLAG's team, matching the banners ("RED
   HEART TAKEN"): steal = full tick with a flag head, return = same tick
   dimmed (the heart snapped home), capture = the chunky match point in the
   CAPTURING team's color. */
.beat-marker.steal { background: var(--tc, var(--amber)); }
.beat-marker.steal::after {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: calc(5 * var(--u));
  height: calc(3 * var(--u));
  background: inherit;
}
.beat-marker.return { background: var(--tc, var(--paper-dim)); opacity: 0.45; }
.beat-marker.capture { background: var(--tc, var(--amber)); width: calc(3 * var(--u)); height: calc(12 * var(--u)); }
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.show { display: block; background: var(--tc, var(--paper-dim)); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.show { color: var(--tc, var(--paper-dim)); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}


/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  /* Cover the BOARD region only — never the scorebug or transport bands. The
     transport must stay clickable under the end card so the scrubber can jump
     back into the match from the score screen (the card cancels server-side
     end-hold on seek). --topband/--band are the measured band heights that
     relayout() maintains on :root; in embed mode both are 0 and the card
     spans the whole iframe as before. */
  left: 0;
  right: 0;
  top: var(--topband, 0px);
  bottom: var(--band, 0px);
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline { color: var(--tc, var(--ghost)); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber.
   Wraps + centers so a 3rd/4th team panel folds to a second row. */
#endcard .ec-teams {
  display: flex;
  gap: calc(22 * var(--u));
  align-items: stretch;
  flex-wrap: wrap;
  justify-content: center;
}
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname { color: var(--tc, var(--paper)); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
#endcard .fl-num { font-size: calc(22 * var(--u)); color: var(--tc, var(--paper)); }
/* mixed-team policy subheader: groups a team panel's rows by policy when a
   team seats more than one (CTF-Doubles: two policies per side) */
#endcard .ec-pol {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u)) calc(26 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(242, 232, 216, 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
/* a 4-team match can retire several rival hearts (GV32: a capture eliminates
   its team and play continues), so the Cap cell lays its hearts in a row,
   later hearts shingling over earlier ones so three still fit the column */
#endcard .ec-row .n.cap {
  color: var(--amber);
  display: flex;
  justify-content: center;
  align-items: center;
}
#endcard .ec-row .n.cap > * + * { margin-left: calc(-7 * var(--u)); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }
/* name cell: name ellipsizes (but keeps a readable floor), the capture mark
   + honor badges ride after it; a pathological pileup clips inside the cell
   rather than bleeding into the K column */
#endcard .ec-row .pcell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
  overflow: hidden;
}
#endcard .ec-row .pcell .pname { flex: 0 1 auto; min-width: 7ch; }
/* honor badges: baked 2x pixel-art icons (nano-banana), luminance-keyed to
   transparency; a repeat count rides after the icon as fine print */
#endcard .ec-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: calc(1 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {
  content: '';
  display: block;
  height: calc(14 * var(--u));
  background-size: contain;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}

/* a team without baked heart art gets a tinted glyph instead (fallback) */
#endcard .ec-heart-glyph {
  color: var(--tc, var(--amber));
  font-size: calc(12 * var(--u));
  line-height: 1;
}
/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  /* above the locker-room curtain (25): connection state stays readable
     while the pre-load scene is up */
  z-index: 26;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   PRE-LOAD CURTAIN — THE BOT LOCKER ROOM
   The wasm/replay boot can take seconds; instead of a dark board
   captioned "Warming up", the stage opens on the backstage room
   UNDER the arena: the four cogs prepping their paintball markers
   in a lamp-lit locker room. The scene is nanobanana-generated
   art (art/lockerroom/ — same warm Ink & Print world as the
   dungeon wall textures): ONE static empty-room plate (bg.jpg)
   with five alpha-sprite poses per cog (<bot>_<pose>.webp)
   layered on top and cycled per bot (see .lk-art below).
   Dismissed by the first ingested frame (dismissLockerRoom).
   Sits UNDER #status (fine-print
   connection state stays readable) and #mmwarn; shown in embed
   mode too — it IS the League Replayer's lit floor while loading.
   ============================================================ */
#lockerroom {
  position: absolute;
  inset: 0;
  z-index: 25;
  overflow: hidden;
  font-family: var(--pixfont);
  background: radial-gradient(120% 95% at 50% 30%, var(--stage-hi) 0%, var(--stage-lo) 55%, #100b07 100%);
  opacity: 1;
  transition: opacity 600ms ease;
}
#lockerroom.gone { opacity: 0; pointer-events: none; }

/* hanging-lamp light: an amber pool over the room + a low bounce off the
   floor, with the occasional basement-fixture flicker */
#lockerroom .lk-glow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(46% 60% at 50% 28%, rgba(232, 163, 61, 0.15), transparent 70%),
    radial-gradient(62% 26% at 50% 88%, rgba(232, 163, 61, 0.08), transparent 75%);
  animation: lk-flicker 9s linear infinite;
}
@keyframes lk-flicker {
  0%, 86%, 90%, 95%, 100% { opacity: 1; }
  88% { opacity: 0.78; }
  93% { opacity: 0.9; }
}

/* The scene: ONE static background plate (bg.jpg — the empty room) with
   the four cogs layered on top as freestanding alpha sprites, five
   generated poses each. Every bot runs its own pose carousel (distinct
   cycle length + phase, crossfaded windows) over its own idle sway, so
   the composed scene never repeats for minutes — smooth continuous
   animation over a rock-solid background. A soft radial mask melts the
   plate's edges into the stage gradient, and the whole scene breathes
   on a slow zoom. */
#lockerroom .lk-art {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: lk-breathe 14s ease-in-out infinite alternate;
}
@keyframes lk-breathe { from { transform: scale(1); } to { transform: scale(1.03); } }
#lockerroom .lk-bg {
  display: block;
  max-width: 94%;
  max-height: 96%;
  -webkit-mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
  mask-image: radial-gradient(ellipse 74% 80% at 50% 48%, #000 50%, transparent 99%);
}
/* sprite plane, fitted to the bg image's box by fitLockerSprites() */
#lockerroom .lk-sprites { position: absolute; }
/* one wrapper per bot (anchored over its floor spot, carries the idle
   sway), its pose sprites stacked bottom-center inside */
#lockerroom .lk-boto { position: absolute; transform-origin: 50% 100%; }
#lockerroom .lk-boto img {
  position: absolute;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  opacity: 0;
  animation: lk-pose var(--cyc, 4s) linear infinite;
}
/* each pose owns a crossfaded 1/5 window of its bot's cycle (delay-shifted) */
@keyframes lk-pose {
  0% { opacity: 0; }
  4% { opacity: 1; }
  20% { opacity: 1; }
  24% { opacity: 0; }
  100% { opacity: 0; }
}
/* idle sway per seat: subtle, distinct tempi so the row never metronomes */
@keyframes lk-sway { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1.5px) rotate(0.6deg); } }
#lockerroom .lk-boto:nth-child(1) { animation: lk-sway 3.4s ease-in-out infinite; }
#lockerroom .lk-boto:nth-child(2) { animation: lk-sway 2.9s ease-in-out -1.2s infinite; }
#lockerroom .lk-boto:nth-child(3) { animation: lk-sway 3.8s ease-in-out -0.6s infinite; }
#lockerroom .lk-boto:nth-child(4) { animation: lk-sway 3.1s ease-in-out -2s infinite; }

/* rotating prep-talk line + amber scan bar + fine print, over the floor */
#lockerroom .lk-cap {
  position: absolute;
  bottom: 13%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  color: var(--paper-dim);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.8), 0 0 calc(8 * var(--u)) rgba(10, 7, 4, 0.9);
  transition: opacity 150ms;
}
#lockerroom .lk-cap.swap { opacity: 0; }
#lockerroom .lk-bar {
  position: absolute;
  bottom: 10.2%;
  left: 50%;
  transform: translateX(-50%);
  width: calc(150 * var(--u));
  height: calc(3 * var(--u));
  background: rgba(242, 232, 216, 0.12);
  border-radius: calc(2 * var(--u));
  overflow: hidden;
}
#lockerroom .lk-bar i {
  position: absolute;
  top: 0; bottom: 0;
  left: -34%;
  width: 34%;
  border-radius: calc(2 * var(--u));
  background: linear-gradient(90deg, transparent, var(--amber), transparent);
  animation: lk-scan 1.6s ease-in-out infinite alternate;
}
@keyframes lk-scan { from { left: -34%; } to { left: 100%; } }
#lockerroom .lk-sub {
  position: absolute;
  bottom: 6.4%;
  left: 0; right: 0;
  text-align: center;
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--ghost);
  text-shadow: 0 1px 0 rgba(10, 7, 4, 0.9);
}

@media (prefers-reduced-motion: reduce) {
  #lockerroom * { animation: none !important; }
  /* with the carousels stopped, hold each bot's rest pose over the plate */
  #lockerroom .lk-boto img:first-child { opacity: 1; }
}

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }


/* ============================================================
   HIDDEN-AGENDA additions to the inherited coworld-ctf chrome.
   Everything ABOVE this block is the starter's CSS, kept verbatim except for
   the four element families the design note removes (#viewpanel + children,
   #fpv + children, #povBadge, #mmwarn). Everything BELOW is this game's own:
   the two plate sublines, the roster strip with the spectator role reveal, the
   vote board, the CAUGHT! banner, the beat-marker rules and the 360px rules.

   Nothing here touches the transport band. relayout() still owns --hudscale,
   --topband and --band on :root; the endcard still stops at
   bottom: var(--band, 0px) and is still dismissed by every seek; and every
   scrubber beat this block draws is a LABELLED, CLICKABLE BUTTON that seeks on
   click, styled for EVERY kind the sim emits: meeting, freeze, caught, eject,
   deposit, gameover. The builder is named buildAgendaBeats precisely so it can
   never be shadowed by the chrome alias block's own hoisted declaration of
   markBeat (cogame-tandem, 2026-08-23).
   ============================================================ */

/* --- plate identity --------------------------------------------------- */
.plate.crew { --tc: #3f7cc4; }
.plate.impostor { --tc: #e0523a; }

/* The plate name must survive a 360px featured-match iframe: it grows into
   whatever room the plate has and ellipsises only when it genuinely runs out,
   never collapsing to a bare "…". */
.plate-name {
  flex: 1 1 auto;
  min-width: 3.2em;
  overflow: hidden;
  text-overflow: ellipsis;
}
.plate .ha-sub {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
  margin-top: calc(3 * var(--u));
}
.plate.side-r .ha-sub { text-align: right; }
.plate .cooldown {
  display: inline-flex;
  gap: calc(2 * var(--u));
  margin-left: calc(5 * var(--u));
  vertical-align: middle;
}
.plate .cooldown i {
  width: calc(5 * var(--u));
  height: calc(5 * var(--u));
  background: var(--tc, var(--amber));
  opacity: 0.28;
  display: inline-block;
}
.plate .cooldown i.on { opacity: 1; }

/* --- roster strip: five chips under the scorebug ---------------------- */
/* Clipped to the board region between --topband and --band: no overlay ever
   sits inside the transport band. */
#rosterstrip {
  position: absolute;
  top: calc(var(--topband, 0px) + 5 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: calc(5 * var(--u));
  z-index: 8;
  pointer-events: none;
  max-width: 96%;
}
.rchip {
  display: flex;
  align-items: center;
  gap: calc(4 * var(--u));
  padding: calc(2 * var(--u)) calc(6 * var(--u));
  background: var(--ink-soft);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--paper);
  white-space: nowrap;
  box-shadow: inset calc(3 * var(--u)) 0 0 var(--tc, var(--amber));
}
.rchip.imp { box-shadow: inset calc(3 * var(--u)) 0 0 var(--tc, var(--amber)), 0 0 0 calc(1.5 * var(--u)) var(--red); }
.rchip .rglyph { color: var(--tc, var(--paper)); font-family: var(--pixfont); }
.rchip.frozen { opacity: 0.62; }
.rchip.ejected { opacity: 0.35; text-decoration: line-through; }
.rchip .rpol { color: var(--paper-dim); }

/* --- vote board: five VOTER -> TARGET rows, centre-right of the board -- */
#voteboard {
  position: absolute;
  right: calc(10 * var(--u));
  top: 50%;
  transform: translateY(-50%);
  display: none;
  flex-direction: column;
  gap: calc(3 * var(--u));
  padding: calc(7 * var(--u)) calc(9 * var(--u));
  background: rgba(12, 9, 6, 0.82);
  box-shadow: inset 0 0 0 calc(1 * var(--u)) rgba(242, 232, 216, 0.16);
  z-index: 9;
  pointer-events: none;
  max-height: calc(100% - var(--topband, 0px) - var(--band, 0px));
}
#voteboard.on { display: flex; }
#vb-head {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--amber);
  white-space: nowrap;
}
#vb-count {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
.vrow {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  opacity: 0.4;
  transition: opacity 160ms ease;
}
.vrow.filled { opacity: 1; }
.vrow.switched { color: var(--amber); }
.vrow .vfrom { color: var(--tc, var(--paper)); min-width: 3.4em; }
.vrow .varrow { color: var(--paper-dim); }
.vrow .vto { color: var(--paper); }
.vrow .vtally {
  margin-left: auto;
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  color: var(--amber);
}

/* --- CAUGHT! banner: the starter's own lane, one extra kind ----------- */
.banner-chip.caught {
  border-bottom-color: var(--red);
  background: rgba(224, 82, 58, 0.20);
  font-size: calc(15 * var(--u));
  white-space: nowrap;
}
.banner-chip.quiet { border-bottom-color: var(--ghost); color: var(--paper-dim); }
.banner-chip.meeting { border-bottom-color: var(--amber); }

/* --- endcard role reveal ---------------------------------------------- */
#ec-roles {
  display: flex;
  flex-direction: column;
  gap: calc(3 * var(--u));
  margin: calc(8 * var(--u)) 0;
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
}
#ec-roles .erow {
  display: flex;
  gap: calc(8 * var(--u));
  align-items: baseline;
  justify-content: center;
}
#ec-roles .erow .ealias { color: var(--tc, var(--paper)); min-width: 4em; }
#ec-roles .erow .erole {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
#ec-roles .erow.imp .erole { color: var(--red); }
#ec-roles .erow .epol { color: var(--paper-dim); }

/* --- scrubber beats: one rule per kind the sim emits ------------------ */
/* Buttons, not divs: each carries a title + aria-label and seeks on click. */
button.beat-marker {
  border: 0;
  padding: 0;
  cursor: pointer;
  appearance: none;
  background: var(--paper-dim);
}
.beat-marker.meeting {
  background: var(--amber);
  width: calc(2 * var(--u));
  height: calc(11 * var(--u));
}
.beat-marker.freeze {
  background: #bfe9f7;
  width: calc(2 * var(--u));
  height: calc(9 * var(--u));
}
.beat-marker.caught {
  background: var(--red);
  width: calc(3 * var(--u));
  height: calc(13 * var(--u));
}
.beat-marker.eject {
  background: var(--paper);
  width: calc(3 * var(--u));
  height: calc(12 * var(--u));
}
.beat-marker.deposit {
  background: var(--blue);
  width: calc(2 * var(--u));
  height: calc(6 * var(--u));
  opacity: 0.8;
}
.beat-marker.gameover {
  background: var(--amber);
  width: calc(3 * var(--u));
  height: calc(14 * var(--u));
}

/* --- the pre-load curtain must not swallow transport clicks ----------- */
/* Its ~1.5s fade sat over the whole stage and ate the first scrub (ecos,
   2026-08-23). */
#lockerroom { pointer-events: none; }

/* --- 360px: the featured-match iframe --------------------------------- */
/* Under 640px of board the plate labels and sublines go, the plates read
   "CREW 21" / "IMPOSTOR 3", the roster chips drop their policy names and the
   vote board shortens its aliases to three letters. */
#stage.tiny .plate .lives-label,
#stage.tiny .plate .ha-sub,
#stage.tiny .rchip .rpol { display: none; }
#stage.tiny #rosterstrip { gap: calc(3 * var(--u)); }
#stage.tiny .rchip { padding: calc(1 * var(--u)) calc(4 * var(--u)); }
#stage.tiny #voteboard { right: calc(4 * var(--u)); padding: calc(4 * var(--u)) calc(5 * var(--u)); }
#stage.tiny .vrow { font-size: calc(10 * var(--u)); }
#stage.tiny .banner-chip.caught { font-size: calc(11 * var(--u)); }

</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <!-- Pre-load curtain, inherited from the starter with this game's plate. -->
  <div id="lockerroom" role="status" aria-label="Loading replay">
    <div class="lk-art" id="lk-art" aria-hidden="true">
      <img class="lk-bg" id="lk-bg" alt="">
      <div class="lk-sprites" id="lk-sprites"></div>
    </div>
    <div class="lk-glow" aria-hidden="true"></div>
    <div class="lk-cap" id="lk-cap" aria-hidden="true">Sealing the airlock&hellip;</div>
    <div class="lk-bar" aria-hidden="true"><i></i></div>
    <div class="lk-sub">Station airlock &middot; Loading replay</div>
  </div>

  <div id="chrome">
    <!-- Two plates, keyed crew and impostor, on the starter's own plate
         machinery: headline, big numeral, label, subline. -->
    <div id="scorebug">
      <div class="plates" id="plates-l"></div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">&#9656;&#9656;</span>
          <div class="caption" id="clock-caption">Sealing the airlock</div>
        </div>
      </div>

      <div class="plates" id="plates-r"></div>
    </div>

    <!-- HIDDEN-AGENDA: the roster strip (spectator-side role reveal) and the
         vote board. Both are clipped to the board region between --topband and
         --band; neither sits in the transport band. -->
    <div id="rosterstrip"></div>
    <div id="voteboard">
      <div id="vb-head">MEETING</div>
      <div id="vb-rows"></div>
      <div id="vb-count">RESOLVES IN &mdash;</div>
    </div>

    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">&#10226;</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">&#9666;|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">&#9654;</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|&#9656;</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">&#8635;</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">&#9656;&#9656;</button>
        <button class="tbtn" id="btn-spoilers" title="Spoilers: meetings / freezes / ejections / winner on the timeline ahead of the playhead (o)">spoilers</button>
        <span class="ffwd-chip" id="ffwd-chip">&#9656;&#9656; SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">RACE TO WIN</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">&mdash;</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <!-- HIDDEN-AGENDA: the role reveal table. -->
      <div id="ec-roles"></div>
      <div class="ec-teams" id="ec-teams"></div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- WIRE_CONSTANTS -->
<!-- CHROME_COMMON -->
<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // ============================================================
  //  HIDDEN-AGENDA additions to the inherited coworld-ctf chrome.
  //  Everything above the banner comment in the style block is the starter's;
  //  everything here is the game block: the two plate sublines, the vote board,
  //  the roster strip with the spectator role reveal, the CAUGHT! banner
  //  builder, the feed row builders, the endcard role reveal, and the scrubber
  //  beat buttons.
  //
  //  The shared chrome (chrome_common.js) still owns naming, escaping, the
  //  transport bar, the speed chips, the beat markers, the lull shading, the
  //  spoilers gate and the momentum graph. This block never re-implements any
  //  of them.
  // ============================================================

  var $ = function (id) { return document.getElementById(id); };

  if (!window.ChromeCommon) {
    console.error('replay_broadcast: chrome_common.js missing - this page ' +
      'must be served spliced (native server or dist bundle), not opened raw.');
    return;
  }

  var core = null;
  function send(cmd) { if (core) core.sendCommand(cmd); }

  var lastState = null;
  var C = window.ChromeCommon({
    send: function (cmd) { send(cmd); },
    sendPov: function () { /* Hidden Agenda has no POV lens. */ },
    getState: function () { return lastState; }
  });

  // The chrome alias block. NOTE the game block's own beat builder is called
  // buildAgendaBeats, NEVER markBeat: a game-block `function markBeat` is
  // hoisted over this `var markBeat` and silently kills every scrubber beat
  // (cogame-tandem, 2026-08-23).
  var esc = C.esc;
  var fmt = C.fmt;
  var teamCol = C.teamCol;
  var setName = C.setName;
  var teamName = C.teamName;
  var markBeat = C.markBeat;
  var setVerdict = C.setVerdict;
  var AMBER = C.AMBER;
  var RED = C.RED;

  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');
  var feedEl = $('killfeed');
  var bannerEl = $('bannerlane');

  var BOARD_W = (window.CTF_WIRE && window.CTF_WIRE.boardW) || 1080;
  var BOARD_H = (window.CTF_WIRE && window.CTF_WIRE.boardH) || 760;
  var BOARD_ASPECT = BOARD_W / BOARD_H;

  // ---- pre-load curtain (the starter's, with this game's plate) ----------
  var lockerEl = $('lockerroom');
  var lockerGone = false;
  var lockerShownAt = Date.now();
  var LOCKER_MIN_DWELL_MS = 900;
  function dismissLockerRoom() {
    if (lockerGone) return;
    lockerGone = true;
    var wait = Math.max(0, LOCKER_MIN_DWELL_MS - (Date.now() - lockerShownAt));
    setTimeout(function () {
      lockerEl.classList.add('gone');
      setTimeout(function () { lockerEl.style.display = 'none'; }, 650);
    }, wait);
  }

  // ---- plate flag icon (the starter's shape; unknown keys fall back to
  //      the shared chrome's AMBER) ------------------------------------------
  function buildFlag(el, color) {
    el.innerHTML =
      '<svg viewBox="0 0 26 30" aria-hidden="true">' +
      '<rect x="4" y="2" width="2" height="26" fill="#2a1f16"/>' +
      '<g class="cloth"><path d="M6 3 L22 3 L18 9 L22 15 L6 15 Z" fill="' +
      (color || AMBER) + '"/></g>' +
      '<rect x="1" y="26" width="10" height="3" fill="#8a7f72"/>' +
      '</svg>';
  }

  // ---- feed + banner queues (the starter's signatures, unchanged) --------
  var MAX_FEED = 4;
  function pushFeed(row) {
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) {
      feedEl.removeChild(feedEl.lastChild);
    }
    row.style.animationDuration = '250ms';
    setTimeout(function () {
      if (row.parentNode) {
        row.classList.add('leaving');
        setTimeout(function () {
          if (row.parentNode) row.parentNode.removeChild(row);
        }, 300);
      }
    }, 2600);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  function feedRow(html, cls) {
    var row = document.createElement('div');
    row.className = 'feed-row' + (cls ? ' ' + cls : '');
    row.innerHTML = html;
    pushFeed(row);
  }

  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    chip.style.animationDuration = '300ms';
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, 1900);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // ---- names -------------------------------------------------------------
  function agenda(s) { return (s && s.agenda) || {}; }
  function aliasOf(s, slot) {
    var r = (s.roster || [])[slot];
    return (r && r.name) || ('#' + slot);
  }
  function policyOf(s, slot) {
    var r = (s.roster || [])[slot];
    return (r && r.pol) || '';
  }
  function slotOfAlias(s, alias) {
    var roster = s.roster || [];
    for (var i = 0; i < roster.length; i++) {
      if (roster[i].name === alias) return roster[i].s;
    }
    return -1;
  }
  function colourOfAlias(s, alias) {
    var slot = slotOfAlias(s, alias);
    var colours = ['#e0523a', '#3f7cc4', '#45a85e', '#ddc531', '#d96ab0'];
    return slot >= 0 ? colours[slot % colours.length] : AMBER;
  }
  function roomWords(name) {
    return String(name || '').toUpperCase();
  }

  // ============================================================
  //  Scorebug: two plates, keyed crew and impostor.
  //  Crew plate: headline CREW, big number = deposits, label Deposits,
  //  subline "21 / 32". Impostor plate: headline IMPOSTOR, big number = active
  //  crew, label Crew left, subline the impostor's alias + policy and a
  //  freeze-cooldown pip bar.
  // ============================================================
  var sbBuilt = false;
  function ensureScorebug() {
    if (sbBuilt) return;
    sbBuilt = true;
    var sides = [$('plates-l'), $('plates-r')];
    ['crew', 'impostor'].forEach(function (team, i) {
      var plate = document.createElement('div');
      plate.className = 'plate ' + team + ' ' + (i === 0 ? 'side-l' : 'side-r');
      plate.setAttribute('data-team', team);
      plate.innerHTML =
        '<div class="flagicon" id="flag-' + team + '"></div>' +
        '<div class="team-id">' +
        '<div class="lives-line">' +
        '<span class="team-name plate-name" id="name-' + team + '">' +
        team.toUpperCase() + '</span>' +
        '<span class="lives-label" id="lbl-' + team + '">' +
        (team === 'crew' ? 'Deposits' : 'Crew left') + '</span>' +
        '<span class="lives-num" id="lives-' + team + '">&mdash;</span>' +
        '</div>' +
        '<div class="ha-sub" id="sub-' + team + '"></div>' +
        '</div>';
      sides[i].appendChild(plate);
      buildFlag($('flag-' + team), teamCol(team) ||
        (team === 'crew' ? '#3f7cc4' : RED));
    });
  }

  function pipBar(value, total, count) {
    var on = total > 0 ? Math.round((1 - value / total) * count) : count;
    var html = '<span class="cooldown">';
    for (var i = 0; i < count; i++) {
      html += '<i class="' + (i < on ? 'on' : '') + '"></i>';
    }
    return html + '</span>';
  }

  function renderScorebug(s) {
    ensureScorebug();
    var a = agenda(s);
    setName('name-crew', teamName(s, 'crew', 'CREW'));
    setName('name-impostor', 'IMPOSTOR');
    $('lives-crew').textContent = String(a.dep === undefined ? 0 : a.dep);
    $('lives-impostor').textContent =
      String(a.crew === undefined ? 0 : a.crew);
    $('sub-crew').textContent =
      (a.dep === undefined ? 0 : a.dep) + ' / ' + (a.tgt || 32);
    var impAlias = a.imp >= 0 ? aliasOf(s, a.imp) : '?';
    var impPol = a.imp >= 0 ? policyOf(s, a.imp) : '';
    var cooldownTotal = a.coolMax || 260;
    $('sub-impostor').innerHTML =
      esc(impAlias) + (impPol ? ' &middot; ' + esc(impPol) : '') +
      pipBar(a.cool || 0, cooldownTotal, 5);
  }

  // ---- clock: spelled out, never "M4" -----------------------------------
  function renderClock(s) {
    var a = agenda(s);
    $('clock-time').textContent = 'TICK ' + s.t + ' / ' + (s.mt || s.mx);
    var caption;
    if (s.ph === 'gameover') {
      caption = 'FINAL';
    } else if (a.m && a.m.phase > 0) {
      var stage = a.m.phase >= 5 ? 'RESOLVED'
        : (a.m.phase >= 4 ? 'VOTES CHANGING'
          : (a.m.phase >= 3 ? 'VOTING' : 'MEETING CALLED'));
      caption = 'MEETING ' + a.m.n + ' \u2014 ' + stage;
    } else {
      caption = 'DEPOSITS ' + (a.dep || 0) + ' / ' + (a.tgt || 32);
    }
    $('clock-caption').textContent = caption;
  }

  // ============================================================
  //  Roster strip: five chips under the scorebug, each with its body colour,
  //  a state glyph and - spectator-side ONLY - a red ring on the impostor.
  // ============================================================
  var rosterKey = '';
  function renderRoster(s) {
    var a = agenda(s);
    var states = a.states || [];
    var key = (s.roster || []).map(function (r) { return r.name + r.pol; })
      .join('|') + '#' + states.join(',') + '#' + a.imp;
    if (key === rosterKey) return;
    rosterKey = key;
    var host = $('rosterstrip');
    var html = '';
    (s.roster || []).forEach(function (r, i) {
      var state = states[i] || 'active';
      var glyph = state === 'frozen' ? '\u2744'
        : (state === 'ejected' ? '\u2715' : '\u25cf');
      html += '<span class="rchip ' + state +
        (i === a.imp ? ' imp' : '') + '" style="--tc:' +
        colourOfAlias(s, r.name) + '">' +
        '<span class="rglyph">' + glyph + '</span>' +
        '<span class="ralias">' + esc(r.name) + '</span>' +
        (r.pol ? '<span class="rpol">' + esc(r.pol) + '</span>' : '') +
        '</span>';
    });
    host.innerHTML = html;
  }

  // ============================================================
  //  Vote board: five VOTER -> TARGET rows, greyed until the reveal tick,
  //  filled simultaneously, flipped to amber on any row that changes at the
  //  switch tick. This is where "live vote changes in the last ticks" is
  //  legible.
  // ============================================================
  var voteSnapshot = {};
  function shortAlias(alias) {
    var map = { RED: 'RED', BLUE: 'BLU', GREEN: 'GRN', YELLOW: 'YEL',
      PINK: 'PNK' };
    return map[alias] || String(alias).slice(0, 3);
  }
  function renderVoteBoard(s) {
    var a = agenda(s);
    var board = $('voteboard');
    var meeting = a.m || {};
    var on = (meeting.phase || 0) > 0;
    board.classList.toggle('on', on);
    if (!on) { voteSnapshot = {}; return; }
    var tiny = stage.classList.contains('tiny');
    $('vb-head').textContent = 'MEETING ' + (meeting.n || 0) + ' \u2014 ' +
      (meeting.cause === 'witness' ? 'WITNESSED FREEZE' : 'SCHEDULED');
    var votes = meeting.votes || {};
    var tally = meeting.tally || {};
    var states = a.states || [];
    var html = '';
    (s.roster || []).forEach(function (r, i) {
      if (states[i] === 'frozen' || states[i] === 'ejected') return;
      var target = votes[r.name];
      var changed = voteSnapshot[r.name] !== undefined &&
        voteSnapshot[r.name] !== target && target !== undefined;
      var name = tiny ? shortAlias(r.name) : r.name;
      var to = target === undefined ? '\u2014'
        : (target === 'skip' ? 'SKIP' : (tiny ? shortAlias(target) : target));
      html += '<div class="vrow' + (target !== undefined ? ' filled' : '') +
        (changed ? ' switched' : '') + '" style="--tc:' +
        colourOfAlias(s, r.name) + '">' +
        '<span class="vfrom">' + esc(name) + '</span>' +
        '<span class="varrow">&rarr;</span>' +
        '<span class="vto">' + esc(to) + '</span>' +
        '<span class="vtally">' + (tally[r.name] ? '\u25cf'.repeat(
          Math.min(4, tally[r.name])) : '') + '</span>' +
        '</div>';
    });
    $('vb-rows').innerHTML = html;
    $('vb-count').textContent = meeting['in'] > 0
      ? 'RESOLVES IN ' + meeting['in'] : 'RESOLVED';
    voteSnapshot = {};
    Object.keys(votes).forEach(function (k) { voteSnapshot[k] = votes[k]; });
  }

  // ============================================================
  //  Feed + banners, one builder per event kind the sim emits.
  // ============================================================
  function applyEvent(e, s) {
    var colour = function (alias) { return colourOfAlias(s, alias); };
    var tint = function (alias) {
      return '<span style="color:' + colour(alias) + '">' + esc(alias) +
        '</span>';
    };
    switch (e.k) {
      case 'freeze':
        var victim = e.victim;
        var freezer = aliasOf(s, e.seat);
        var where = roomWords(e.room || '');
        if (e.witnesses && e.witnesses.length) {
          banner('CAUGHT! ' + freezer + ' FROZE ' + victim + ' \u2014 ' +
            e.witnesses.join(' + ') + ' SAW IT', 'caught');
        } else {
          banner(victim + ' WAS FROZEN \u2014 NOBODY SAW IT', 'quiet');
        }
        feedRow(tint(freezer) + ' FROZE ' + tint(victim) +
          (where ? ' IN ' + esc(where) : ''), 'flagkill');
        break;
      case 'witness':
        feedRow(tint(e.witness) + ' SAW IT');
        break;
      case 'deposit':
        if (e.total % 4 === 0) {
          feedRow('DEPOSITS ' + e.total + ' / ' +
            (agenda(s).tgt || 32));
        }
        break;
      case 'fakedeposit':
        feedRow(tint(aliasOf(s, e.seat)) +
          ' DROPPED A GEM &mdash; THE COUNTER DIDN\u2019T MOVE');
        break;
      case 'meeting':
        banner('MEETING ' + e.n + ' CALLED \u2014 ' +
          (e.cause === 'witness' ? 'WITNESSED FREEZE' : 'SCHEDULED'),
          'meeting');
        feedRow('MEETING ' + e.n + ' CALLED &mdash; ' +
          (e.cause === 'witness' ? 'WITNESSED FREEZE' : 'SCHEDULED'));
        break;
      case 'say':
        feedRow(tint(aliasOf(s, e.seat)) + ' &ldquo;' + esc(e.text) +
          '&rdquo;');
        break;
      case 'vote':
        feedRow(tint(aliasOf(s, e.seat)) +
          (e.phase === 'switch' ? ' SWITCHED &rarr; ' : ' &rarr; ') +
          esc(e.target === 'skip' ? 'SKIP' : e.target));
        break;
      case 'eject':
        if (e.target) {
          var counts = [];
          Object.keys(e.tally || {}).forEach(function (k) {
            counts.push(e.tally[k]);
          });
          counts.sort(function (x, y) { return y - x; });
          var score = counts.length > 1 ? counts[0] + '-' + counts[1]
            : String(counts[0] || 0);
          feedRow(tint(e.target) + ' EJECTED ' + score + ' &mdash; ' +
            (e.wasImpostor ? 'THE IMPOSTOR' : 'CREW'),
            e.wasImpostor ? 'flagkill' : '');
          banner(e.target + ' EJECTED \u2014 ' +
            (e.wasImpostor ? 'THE IMPOSTOR' : 'A CREWMATE'),
            e.wasImpostor ? 'caught' : 'quiet');
        } else {
          feedRow('NOBODY EJECTED &mdash; ' + esc(String(e.outcome)
            .toUpperCase()));
        }
        break;
      case 'order':
        var steps = (e.plan || []).map(function (p) {
          return p.job + (p.at ? ' ' + p.at : '') +
            (p.who ? ' ' + p.who : '') + (p.room ? ' ' + p.room : '');
        }).join(', ');
        var tag = (e.source === 'fallback' || e.source === 'scripted' ||
          e.source === 'budget') ? ' <span class="badge">auto</span>' : '';
        feedRow(tint(aliasOf(s, e.seat)) + ' &rarr; ' + esc(steps) +
          (e.hunch ? ' &ldquo;' + esc(e.hunch) + '&rdquo;' : '') + tag);
        break;
      default:
        break;
    }
  }

  // ============================================================
  //  Scrubber beats. buildAgendaBeats ingests state.beats on the first HUD
  //  frame and calls the chrome's aliased markBeat for each; upgradeBeatButtons
  //  is the post-pass that turns every placed .beat-marker div into a LABELLED,
  //  CLICKABLE button wired to seek(tick). There is CSS for every kind the game
  //  emits - meeting, freeze, caught, eject, deposit, gameover - and no others
  //  are emitted.
  // ============================================================
  var beatsIngested = false;
  var beatLabels = {};
  function buildAgendaBeats(s) {
    if (beatsIngested || !s.beats) return;
    beatsIngested = true;
    for (var i = 0; i < s.beats.length; i++) {
      var b = s.beats[i];
      var label;
      switch (b.k) {
        case 'meeting': label = 'Meeting ' + (b.n || '') + ' at tick ' + b.t;
          break;
        case 'freeze': label = (b.who || 'a crewmate') + ' frozen at tick ' +
          b.t; break;
        case 'caught': label = 'Witnessed freeze at tick ' + b.t; break;
        case 'eject': label = (b.who || 'somebody') + ' ejected at tick ' +
          b.t; break;
        case 'deposit': label = 'Deposit ' + (b.n || '') + ' at tick ' + b.t;
          break;
        case 'gameover': label = 'Game over at tick ' + b.t; break;
        default: label = b.k + ' at tick ' + b.t; break;
      }
      beatLabels[b.t + '|' + b.k] = label;
      markBeat(b.t, b.k, '');
      if (b.k === 'gameover') {
        setVerdict({
          t: b.t,
          winner: b.winner === 'none' ? '' : b.winner,
          draw: b.winner === 'none'
        });
      }
    }
  }

  function upgradeBeatButtons(s) {
    var host = $('scrub');
    var placed = host.querySelectorAll('div.beat-marker');
    for (var i = 0; i < placed.length; i++) {
      (function (div) {
        var kind = '';
        div.classList.forEach(function (cls) {
          if (cls !== 'beat-marker' && !kind) kind = cls;
        });
        var tick = div.__tick;
        var button = document.createElement('button');
        button.type = 'button';
        button.className = div.className;
        button.style.left = div.style.left;
        button.__tick = tick;
        button.__kind = kind;
        var label = beatLabels[tick + '|' + kind] ||
          (kind + ' at tick ' + tick);
        button.title = label;
        button.setAttribute('aria-label', label);
        button.addEventListener('click', function (ev) {
          ev.stopPropagation();
          seekTo(tick);
        });
        div.parentNode.replaceChild(button, div);
      })(placed[i]);
    }
    applyBeatSpoilers(s);
  }

  function applyBeatSpoilers(s) {
    // The chrome's own spoiler gate holds the DIVs it placed; these buttons
    // replaced them, so the gate is re-applied here against the same rule.
    var show = C.getSpoilers();
    var buttons = $('scrub').querySelectorAll('button.beat-marker');
    for (var i = 0; i < buttons.length; i++) {
      var hide = !show && buttons[i].__tick > s.t;
      buttons[i].style.display = hide ? 'none' : '';
    }
  }

  // ============================================================
  //  Endcard: the verdict in words, then the role reveal table, then the line
  //  of counters. Dismissed by every seek.
  // ============================================================
  var endcardShown = false;
  function hideEndcard() {
    endcardShown = false;
    $('endcard').classList.remove('on');
  }
  function renderEndcard(s) {
    var over = s.over;
    if (!over) { hideEndcard(); return; }
    if (endcardShown) return;
    endcardShown = true;
    var headline;
    switch (over.ending) {
      case 'crew_deposits':
        headline = 'CREW WIN \u2014 ' + over.deposits + ' DEPOSITS'; break;
      case 'impostor_ejected':
        headline = 'CREW WIN \u2014 THE IMPOSTOR WAS EJECTED'; break;
      case 'impostor_isolation':
        headline = 'IMPOSTOR WINS \u2014 ONE CREWMATE LEFT'; break;
      case 'timeout':
        headline = 'TIE \u2014 ' + (s.mt || s.mx) + ' TICKS, 0-0'; break;
      case 'deadline': headline = 'TIME'; break;
      case 'forfeit': headline = 'FORFEIT'; break;
      default: headline = String(over.ending || '').toUpperCase(); break;
    }
    $('ec-headline').textContent = headline;
    $('ec-wincond').textContent =
      'Crew win at ' + (over.depositTarget || 32) + ' deposits or by ' +
      'ejecting the impostor. The impostor wins at one crewmate left.';
    var roles = agenda(s).roles || [];
    var html = '';
    (s.roster || []).forEach(function (r, i) {
      var role = roles[i] || 'crew';
      html += '<div class="erow' + (role === 'impostor' ? ' imp' : '') +
        '" style="--tc:' + colourOfAlias(s, r.name) + '">' +
        '<span class="ealias">' + esc(r.name) + '</span>' +
        '<span class="erole">' + esc(role) + '</span>' +
        '<span class="epol">' + esc(r.pol || '') + '</span>' +
        '</div>';
    });
    $('ec-roles').innerHTML = html;
    $('ec-how').textContent =
      over.freezes + ' freeze' + (over.freezes === 1 ? '' : 's') +
      ' \u00b7 ' + over.witnessed + ' witnessed \u00b7 ' +
      over.ejections + ' ejection' + (over.ejections === 1 ? '' : 's') +
      ' (' + (over.wrong ? over.wrong + ' wrong' : 'right') + ') \u00b7 ' +
      over.fake + ' fake deposits \u00b7 ' + over.meetings + ' meetings';
    $('ec-replay').textContent = 'Press , to replay from the start.';
    $('endcard').classList.add('on');
  }

  // ============================================================
  //  Frame ingest
  // ============================================================
  var lastTick = -1;
  function onFrame(txt) {
    var s;
    try { s = JSON.parse(txt); } catch (e) { return; }
    lastState = s;
    dismissLockerRoom();

    var stride = (s.sp || 1) * (s.ff ? 8 : 1);
    var jumped = (s.t < lastTick) ||
      (lastTick >= 0 && s.t - lastTick > stride * 4 + 2);
    if (jumped) { clearFeed(); clearBanners(); hideEndcard(); }
    lastTick = s.t;

    C.ingestLeadSeries(s);
    C.ingestLullSpans(s);
    buildAgendaBeats(s);

    renderScorebug(s);
    renderClock(s);
    C.renderTransport(s);
    upgradeBeatButtons(s);
    renderRoster(s);
    renderVoteBoard(s);

    if (s.events && s.events.length && !jumped) {
      for (var i = 0; i < s.events.length; i++) applyEvent(s.events[i], s);
    }
    renderEndcard(s);
  }

  function onStatus(st) {
    statusEl.textContent = st;
    statusEl.classList.toggle('show', st !== 'open');
  }

  // ============================================================
  //  Core + transport
  // ============================================================
  var replayAdapter = window.HiddenAgendaStaticReplay || null;
  var coreConfig = {
    canvas: canvas,
    onText: function (txt) { onFrame(txt); },
    onStatus: function (st) { onStatus(st); },
    onFirstFrame: function () { core.setViewportFit(); },
    onTransform: function () { }
  };
  core = replayAdapter
    ? replayAdapter.createCore(coreConfig)
    : window.BroadcastCore.create(coreConfig);

  function seekTo(tick) {
    hideEndcard();
    send('s:' + Math.max(0, Math.round(tick)));
  }

  $('btn-play').addEventListener('click', function () { send(' '); });
  $('btn-restart').addEventListener('click', function () {
    hideEndcard(); send(',');
  });
  $('btn-back').addEventListener('click', function () {
    hideEndcard(); send('b');
  });
  $('btn-fwd').addEventListener('click', function () {
    hideEndcard(); send('.');
  });
  $('btn-end').addEventListener('click', function () {
    hideEndcard(); send('e');
  });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  $('scrub').addEventListener('click', function (ev) {
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    var s = lastState;
    if (!s) return;
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    seekTo(st + Math.round(frac * (mx - st)));
  });

  window.addEventListener('keydown', function (ev) {
    var k = ev.key;
    if (k === ' ') { send(' '); ev.preventDefault(); }
    else if (k === ',' || k === '<') { hideEndcard(); send(','); }
    else if (k === '.' || k === '>') { hideEndcard(); send('.'); }
    else if (k === 'b') { hideEndcard(); send('b'); }
    else if (k === 'e') { hideEndcard(); send('e'); }
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === 'o') C.setSpoilers(!C.getSpoilers());
    else if (k === '+' || k === '=') send('+');
    else if (k === '-' || k === '_') send('-');
  });

  // ============================================================
  //  Layout. relayout() sets --hudscale, --topband and --band on :root and
  //  reserves each band's measured height, so no overlay ever sits inside the
  //  transport band and the endcard stops at bottom: var(--band, 0px).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    var scorebug = $('scorebug');
    var transport = $('transport');
    var root = document.documentElement;
    var topBand =
      parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band =
      parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    for (var pass = 0; pass < 4; pass++) {
      var prevTop = topBand, prevBand = band;
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stage.style.width = boardW + 'px';
      stage.style.height = (boardH + topBand + band) + 'px';
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
      if (Math.abs(topBand - prevTop) < 0.5 &&
          Math.abs(band - prevBand) < 0.5) break;
    }
    if (core) core.setViewportFit();
  }
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(viewport);
  window.addEventListener('resize', relayout);

  ensureScorebug();
  relayout();
  core.start();

  // Exposed for tools/ci/renderer_fixture.html, which drives the same builders
  // against a worst-case synthetic frame (full-cap say/hunch/notes on all five
  // seats, the vote board at five rows, the CAUGHT! banner at full length).
  window.HiddenAgendaChrome = {
    onFrame: onFrame,
    relayout: relayout,
    buildAgendaBeats: buildAgendaBeats,
    upgradeBeatButtons: upgradeBeatButtons
  };
})();

</script>
</body>
</html>
